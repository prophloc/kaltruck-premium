name: site-checks

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run test:run
      - run: php -l public/wycena-wyslij.php
      # Preview tests must not depend on the original website serving OG artwork.
      # Production cPanel builds still download AND verify the exact image.
      - run: node scripts/optimize-hero.mjs && npx astro build
        env:
          PUBLIC_SITE_URL: https://preview.invalid
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chromium
