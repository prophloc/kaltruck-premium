name: Prepare plockhds.pl cPanel package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-cpanel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check site
        run: npm run test:run
      - name: Validate Google Reviews API key
        env:
          PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.KALTRUCK_GOOGLE_MAPS_API_KEY }}
        shell: bash
        run: |
          if [[ -z "${PUBLIC_GOOGLE_MAPS_API_KEY//[[:space:]]/}" ]]; then
            echo "::error title=Brak klucza Google Maps::Ustaw KALTRUCK_GOOGLE_MAPS_API_KEY w Settings > Secrets and variables > Actions. Przerwano generowanie paczki cPanel bez opinii Google."
            exit 1
          fi
          if [[ "$PUBLIC_GOOGLE_MAPS_API_KEY" != AIza* ]]; then
            echo "::error title=Nieprawidlowy klucz Google Maps::Sprawdz sekret KALTRUCK_GOOGLE_MAPS_API_KEY (oczekiwany klucz przegladarkowy Google Maps API)."
            exit 1
          fi
      - name: Validate PHP contact handler syntax
        run: php -l public/wycena-wyslij.php
      - name: Build for plockhds.pl
        run: npm run build
        env:
          PUBLIC_SITE_URL: https://plockhds.pl
          PUBLIC_FORM_ENDPOINT: /wycena-wyslij.php
          PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.KALTRUCK_GOOGLE_MAPS_API_KEY }}
          PUBLIC_GOOGLE_PLACE_ID: ChIJhbMF0yh3HEcRVtTOsPxz9eM
      - name: Verify the original OG image is bundled and referenced locally
        shell: bash
        run: |
          test -s dist/og-image-v02.jpg
          test "$(file -b --mime-type dist/og-image-v02.jpg)" = "image/jpeg"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const html = readFileSync('dist/index.html', 'utf8');
          const expected = 'https://plockhds.pl/og-image-v02.jpg';
          for (const property of ['og:image', 'og:image:secure_url']) {
            if (!html.includes(`property="${property}" content="${expected}"`)) {
              throw new Error(`Missing locally served ${property}: ${expected}`);
            }
          }
          if (!html.includes(`name="twitter:image" content="${expected}"`)) {
            throw new Error('Twitter image does not use the bundled OG artwork.');
          }
          NODE
      - name: Verify Google Reviews configuration in generated HTML
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const html = readFileSync('dist/index.html', 'utf8');
          const section = html.match(/<section\b[^>]*\bdata-google-reviews\b[^>]*>/i)?.[0] || '';
          const hasKey = /\bdata-api-key="AIza[^"]+"/.test(section);
          const hasPlaceId = section.includes('data-place-id="ChIJhbMF0yh3HEcRVtTOsPxz9eM"');
          if (!hasKey || !hasPlaceId) {
            console.error('::error title=Brak konfiguracji opinii w dist::Paczka nie zawiera prawidlowej konfiguracji Google Reviews. Sprawdz sekrety i proces budowania.');
            process.exitCode = 1;
          }
          NODE
      - name: Verify cPanel form handler and public form endpoint
        shell: bash
        run: |
          test -s dist/wycena-wyslij.php
          grep -R -q 'action="/wycena-wyslij.php"' dist/wycena/index.html
      - name: Create HTTPS canonical redirect
        run: |
          cat > dist/.htaccess <<'HTACCESS'
          RewriteEngine On
          RewriteCond %{HTTPS} !=on [OR]
          RewriteCond %{HTTP_HOST} ^www\.plockhds\.pl$ [NC]
          RewriteRule ^ https://plockhds.pl%{REQUEST_URI} [L,R=301,NE]
          HTACCESS
      - name: Package only the compiled site
        run: |
          cd dist
          zip -q -r ../kaltruck-plockhds-upload.zip .
      - name: Upload cPanel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: plockhds-cpanel-ready
          path: kaltruck-plockhds-upload.zip
          retention-days: 30
          if-no-files-found: error
