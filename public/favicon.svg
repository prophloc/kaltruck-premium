<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">KALTRUCK</title>
  <desc id="desc">Monogram K połączony z ramieniem i hakiem żurawia HDS</desc>
  <rect width="64" height="64" rx="13" fill="#090c0f"/>
  <!-- Maszt K: litera pozostaje czytelna nawet w ikonie przeglądarki 16 px. -->
  <path d="M16 12v40" stroke="#f5f2eb" stroke-width="9" stroke-linecap="square"/>
  <!-- Górna ukośna belka staje się złotym ramieniem HDS. -->
  <path d="M27 32 45 14h9" fill="none" stroke="#d7b46a" stroke-width="8" stroke-linecap="square" stroke-linejoin="bevel"/>
  <!-- Druga noga monogramu w kontrastowej bieli. -->
  <path d="M27 34 48 53" fill="none" stroke="#f5f2eb" stroke-width="9" stroke-linecap="square"/>
  <!-- Lina i hak pod końcówką wysięgnika. -->
  <path d="M51 17v12c0 3-2 5-5 5" fill="none" stroke="#d7b46a" stroke-width="3" stroke-linecap="round"/>
</svg>
